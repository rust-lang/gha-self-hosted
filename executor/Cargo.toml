[package]
name = "executor"
version = "0.1.0"
edition = "2024"
default-run = "gha-vm"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5.43", default-features = false, features = ["std", "help", "usage", "derive"] }
getrandom = { version = "0.3.3", features = ["std"] }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.20.0"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["io"] }
zstd = "0.13.3"
